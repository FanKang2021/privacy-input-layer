# privacy-input-layer 配置
# 实际生效路径：%APPDATA%/pilayer/config.yaml（首次运行自动生成，可复制本文件修改）

guard:
  text_enabled: true        # 剪贴板文本自动脱敏
  image_enabled: true       # 剪贴板图片 OCR 打码（需安装 [image] 依赖）
  hdrop_enabled: true       # 复制文件粘贴时替换为脱敏副本
  auto_restore: true        # 复制含占位符的 AI 回复时自动还原
  notify: true              # 托盘气泡通知

rules:
  phone: true               # 中国大陆手机号
  idcard: true              # 18 位身份证（含校验位验证）
  bankcard: true            # 16-19 位银行卡（Luhn 校验）
  email: true               # 电子邮箱
  privkey: true             # PEM 私钥块（OPENSSH/RSA/EC 等）
  ip: true                  # IPv4 地址
  token: true               # 常见 API 令牌（sk-/ghp_/github_pat_/AKIA/xox-/JWT）
  custom_keywords: []       # 自定义敏感词，如 ["张三", "内部项目代号"]

image:
  min_score: 0.5            # OCR 置信度阈值
  fill: [40, 40, 40]        # 打码填充色 RGB

files:
  suffix: ".masked"         # 脱敏副本文件名后缀：report.docx -> report.masked.docx