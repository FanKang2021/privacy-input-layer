[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-input-layer"
version = "0.4.0"
description = "AI 隐私输入层：在内容进入任何 AI 客户端之前完成文本/图片/文件脱敏，本地运行，一键还原"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "privacy-input-layer contributors" }]
keywords = ["privacy", "pii", "clipboard", "ai", "llm", "masking", "dlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "pystray>=0.19",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pywin32>=306; sys_platform == 'win32'",
    "uiautomation>=2.0; sys_platform == 'win32'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "cryptography>=42; sys_platform != 'win32'",
]

[project.optional-dependencies]
image = ["rapidocr-onnxruntime>=1.3", "numpy>=1.24"]
dev = ["pytest>=8.0", "hypothesis>=6.0"]

[project.scripts]
pilayer = "pilayer.cli:main"

[project.urls]
Homepage = "https://github.com/FanKang2021/privacy-input-layer"
Repository = "https://github.com/FanKang2021/privacy-input-layer"
Issues = "https://github.com/FanKang2021/privacy-input-layer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]