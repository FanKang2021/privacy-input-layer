name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to attach assets to"
        required: true
        default: "v0.4.1"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: ""
          - os: macos-latest
            suffix: "-macos-arm64"
          - os: ubuntu-22.04
            suffix: "-linux-x86_64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .[image] pyinstaller
      - name: Embed build provenance
        shell: bash
        run: |
          printf 'SHA = "%s"\nTIME = "%s"\n' "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > src/pilayer/_buildinfo.py
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconsole --onefile --name pilayer-guard --paths src
          --collect-all rapidocr_onnxruntime --collect-all onnxruntime --collect-all pypdfium2
          --hidden-import uiautomation --hidden-import comtypes.gen
          --hidden-import win32com --hidden-import win32com.client
          --hidden-import pystray --hidden-import docx --hidden-import openpyxl --hidden-import pptx --hidden-import img2pdf
          --distpath dist --workpath build --specpath build packaging/run_guard.py
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --noconsole --onefile --name pilayer-guard${{ matrix.suffix }} --paths src
          --collect-all rapidocr_onnxruntime --collect-all onnxruntime --collect-all pypdfium2
          --collect-all objc --collect-all Quartz --collect-all AppKit
          --collect-all ApplicationServices
          --hidden-import pystray --hidden-import docx --hidden-import openpyxl --hidden-import pptx --hidden-import img2pdf
          --distpath dist --workpath build --specpath build packaging/run_guard.py
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: >
          pyinstaller --noconsole --onefile --name pilayer-guard${{ matrix.suffix }} --paths src
          --collect-all rapidocr_onnxruntime --collect-all onnxruntime --collect-all pypdfium2
          --collect-all Xlib --hidden-import Xlib.ext.xtest
          --hidden-import pystray --hidden-import docx --hidden-import openpyxl --hidden-import pptx --hidden-import img2pdf
          --distpath dist --workpath build --specpath build packaging/run_guard.py
      - uses: actions/upload-artifact@v4
        with:
          name: bin${{ matrix.suffix }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          overwrite_files: true
          files: dist/*