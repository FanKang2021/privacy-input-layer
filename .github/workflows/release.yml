name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to attach assets to"
        required: true
        default: "v0.3.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .[image] pyinstaller
      - name: Build exe
        run: >
          pyinstaller --noconsole --onefile --name pilayer-guard --paths src
          --collect-all rapidocr_onnxruntime --collect-all onnxruntime
          --hidden-import uiautomation --hidden-import comtypes.gen
          --hidden-import pystray --hidden-import docx --hidden-import openpyxl
          --distpath dist --workpath build --specpath build packaging/run_guard.py
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          overwrite_files: true
          files: dist/pilayer-guard.exe